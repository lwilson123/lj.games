<link href="style.css" rel="stylesheet" type="text/css" />
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #070b14;
    font-family: Arial, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;

  #background-video {
    position: fixed;

    width:100%;

  }

  h1 a img {
    vertical-align: middle;
    width: 30px;
    height: 30px;
  }

    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
    padding: 10px;
    box-sizing: border-box;
  }

  .iframe-bubble {
    width: 90%;
    max-width: 1200px;
    height: 80%;
    border: 4px solid #a36fff;
    border-radius: 30px;
    box-shadow: 0 0 35px rgba(163,111,255,0.5);
    overflow: hidden;
    background: #0f1624;

  .iframe-bubble iframe {
