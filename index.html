<!DOCTYPE html>
<html>
<head>
  <title>LJ Games | Home</title>
  <link rel="shortcut icon" href="Images/Background.png" />
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #070b14;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #particle-canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .topnav {
      display: flex;
      background: rgba(15,22,36,0.9);
      padding: 10px;
      gap: 15px;
      z-index: 2;
    }

    .topnav a {
      color: #7aa2ff;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .topnav a:hover {
      color: #fff;
      text-shadow: 0 0 8px #a36fff;
    }

    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 2;
      text-align: center;
      gap: 20px;
    }

    /* SMOOTH FLOAT */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }

    /* SMOOTH SHAKE (not aggressive) */
    @keyframes smoothShake {
      0% { transform: translate(0,0); }
      25% { transform: translate(1px,-1px); }
      50% { transform: translate(-1px,1px); }
      75% { transform: translate(1px,1px); }
      100% { transform: translate(0,0); }
    }

    h1 {
      color: white;
      font-size: 3em;
      margin: 0;
      animation: float 4s ease-in-out infinite;
      transition: 0.2s;
    }

    h1:hover {
      animation: smoothShake 0.3s infinite;
      text-shadow: 0 0 20px #a36fff;
    }

    p {
      color: #aaa;
      font-size: 1.2em;
      max-width: 500px;
      transition: 0.3s;
    }

    p:hover {
      animation: smoothShake 0.4s infinite;
      text-shadow: 0 0 10px #a36fff;
    }

    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: transparent;
      border: 2px solid #a36fff;
      padding: 12px 25px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 0 10px rgba(163,111,255,0.4);
    }

    .btn:hover {
      background: #a36fff;
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(163,111,255,0.9);
      animation: smoothShake 0.25s infinite;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 10px;
      font-size: 14px;
      z-index: 2;
    }

    footer:hover {
      text-shadow: 0 0 8px #a36fff;
      animation: smoothShake 0.4s infinite;
    }
  </style>
</head>

<body>

<canvas id="particle-canvas"></canvas>

<div class="topnav">
  <a class="active" href="index.html">Home</a>
  <a href="games.html">Games</a>
  <a href="chat.html">Chat</a>
  <a href="Games/Soundboard/ll/index.html">Soundboard</a>
  <a href="fnfmods.html">FNF Mods</a>
</div>

<div class="main">
  <h1>LJGAMES V10</h1>

  <p>Play games, chat with friends, and explore mods — all in one place.</p>

  <div class="buttons">
    <a href="games.html" class="btn">Play Games</a>
    <a href="chat.html" class="btn">Open Chat</a>
    <a href="fnfmods.html" class="btn">FNF Mods</a>
  </div>
</div>

<footer>Site made by LJGAMES™</footer>

<script>
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');

let particles = [];
const mouse = { x: null, y: null, radius: 120 };

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

window.addEventListener('mousemove', e => {
  mouse.x = e.x;
  mouse.y = e.y;
});

class Particle {
  constructor(){ this.reset(); }

  reset(){
    this.x = Math.random()*canvas.width;
    this.y = Math.random()*canvas.height;
    this.vx = (Math.random()-0.5)*0.6;
    this.vy = (Math.random()-0.5)*0.6;
    this.radius = Math.random()*2+1;
    this.alpha = Math.random()*0.5+0.3;
  }

  update(){
    this.vx += (Math.random()-0.5)*0.02;
    this.vy += (Math.random()-0.5)*0.02;

    if(mouse.x && mouse.y){
      let dx = this.x - mouse.x;
      let dy = this.y - mouse.y;
      let dist = Math.sqrt(dx*dx + dy*dy);

      if(dist < mouse.radius){
        let angle = Math.atan2(dy, dx);
        let force = (mouse.radius - dist) / mouse.radius;

        this.vx += Math.cos(angle) * force * 0.6;
        this.vy += Math.sin(angle) * force * 0.6;
      }
    }

    this.x += this.vx;
    this.y += this.vy;

    this.vx *= 0.99;
    this.vy *= 0.99;

    if(this.x < 0) this.x = canvas.width;
    if(this.x > canvas.width) this.x = 0;
    if(this.y < 0) this.y = canvas.height;
    if(this.y > canvas.height) this.y = 0;
  }

  draw(){
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
    ctx.fillStyle = `rgba(163,111,255,${this.alpha})`;
    ctx.fill();
  }
}

for(let i=0;i<120;i++){
  particles.push(new Particle());
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let p of particles){
    p.update();
    p.draw();
  }

  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      let p1 = particles[i];
      let p2 = particles[j];

      let dx = p1.x - p2.x;
      let dy = p1.y - p2.y;
      let dist = Math.sqrt(dx*dx + dy*dy);

      if(dist < 120){
        ctx.beginPath();
        ctx.strokeStyle = `rgba(163,111,255,${1 - dist/120})`;
        ctx.lineWidth = 1;
        ctx.moveTo(p1.x,p1.y);
        ctx.lineTo(p2.x,p2.y);
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
