<!DOCTYPE html>
<html>
<head>
  <title>LJ Games | Home</title>
  <link rel="shortcut icon" href="Images/Background.png" />
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link href="style.css" rel="stylesheet" type="text/css" />

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #070b14;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .topnav {
      display: flex;
      background: rgba(15,22,36,0.9);
      padding: 10px;
      gap: 15px;
    }

    .topnav a {
      color: #7aa2ff;
      text-decoration: none;
      font-weight: bold;
      padding: 5px 10px;
      transition: 0.2s;
    }

    .topnav a:hover {
      color: #fff;
      text-shadow: 0 0 8px #a36fff;
    }

    .topnav a.active {
      color: #fff;
      border-bottom: 2px solid #a36fff;
      text-shadow: 0 0 10px #a36fff;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    h1 {
      color: white;
      font-size: 3em;
      text-shadow: 0 0 15px #a36fff;
      margin: 0;
    }

    p {
      color: #aaa;
      font-size: 1.2em;
      max-width: 500px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: transparent;
      border: 2px solid #a36fff;
      padding: 12px 25px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(163,111,255,0.4);
    }

    .btn:hover {
      background: #a36fff;
      box-shadow: 0 0 20px rgba(163,111,255,0.8);
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      color: #666;
      padding: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="topnav">
    <a class="active" href="index.html">home</a>
    <a href="games.html">Games</a>
    <a href="chat.html">Chat</a>
    <a href="Games/Soundboard/ll/index.html">soundboard</a>
    <a href="fnfmods.html">FNF Mods</a>
  </div>

  <div class="main">
    <h1>LJGAMES V10</h1>
    <p>Play games, chat with friends, and explore mods — all in one place.</p>

    <div class="buttons">
      <a href="games.html" class="btn">Play Games</a>
      <a href="chat.html" class="btn">Open Chat</a>
      <a href="fnfmods.html" class="btn">FNF Mods</a>
    </div>
  </div>

  <footer>
    Site made by LJGAMES™
  </footer>

</body>
